name: Publish to NPM

on:
  push:
    tags: ['v*']

env:
  NODE_VERSION: 26
  PNPM_VERSION: 12

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Setup
        uses: $/.github/actions/setup
        with:
          NODE_VERSION: ${{ env.NODE_VERSION }}
          PNPM_VERSION: ${{ env.PNPM_VERSION }}

      - name: Check code
        run: pnpm check

      - name: Lint code
        run: pnpm lint

      - name: Prepack
        run: pnpm prepack

      - name: Publish
        run: pnpm publish --tag next --no-git-checks
