name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:

env:
  NODE_VERSION: 26
  PNPM_VERSION: 12

jobs:
  check:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - &setup
        name: Setup
        uses: $/.github/actions/setup
        with:
          NODE_VERSION: ${{ env.NODE_VERSION }}
          PNPM_VERSION: ${{ env.PNPM_VERSION }}

      - name: Check code
        run: pnpm check

  lint:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - *setup

      - name: Lint code
        run: pnpm lint
